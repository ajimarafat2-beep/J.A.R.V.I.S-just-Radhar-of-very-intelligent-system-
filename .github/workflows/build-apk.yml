name: Build Jarvis APK

# GitHub Actions will run this every time code is pushed to main,
# and also when you press "Run workflow" by hand.
# Result: a debug APK in Actions > Artifacts.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # NOTE: this repo has no gradlew script in its root,
      # so we call the installed Gradle directly.
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
